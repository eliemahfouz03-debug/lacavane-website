[build]
  publish = "."
  command = ""

[[redirects]]
  from = "https://lacavane.com/*"
  to = "https://www.lacavane.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
